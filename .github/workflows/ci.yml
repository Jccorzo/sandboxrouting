# Lint, typecheck and tests on every push and pull request, and the workspaces' builds. Each
# check runs through hushrun, which skips what this exact code already passed: the tests by test
# file (a file that passed on the exact files it read doesn't run again), the rest as a whole.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Lets hushrun sign its results keylessly as this repository's CI. No secret is needed.
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # hushrun is a dev dependency, and the npm scripts run each check through it, so CI runs
      # exactly the commands a laptop or an agent runs and a pass on one counts for the others.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The workspaces: back (on PGlite, a real Postgres in WebAssembly) and the dashboard.
      - run: npm run lint -w back
      - run: npm run typecheck -w back
      - run: npm test -w back
      - run: npm run build -w back
      - run: npm run lint -w dashboard
      - run: npm run typecheck -w dashboard
      - run: npm test -w dashboard
      - run: npm run build -w dashboard
      # The site (web/): generated from the router, so it runs after the router's checks.
      - run: npm run lint -w web
      - run: npm run typecheck -w web
      - run: npm test -w web
      - run: npm run build -w web
