# hushrun.yaml: the checks CI runs through hushrun (https://hushrun.com), which skips work this
# exact code already passed. `npx hushrun init` adds the repository's URL on hushrun and the log
# key once the repository is on GitHub.
version: 1
repository: github.com/jccorzo/sandboxrouting
repository_url: https://api.hushrun.com/l/jccorzot/sandboxrouting

checks:
  # Vitest's test files are the unit: a file that already passed on the exact files it read
  # doesn't run again (vitest.config.ts loads hushrun's plugin when hushrun asks for it).
  test:
    tests: reuse
  # Whole-project checks: any change re-runs them.
  lint: {}
  typecheck: {}

  # The workspaces' own checks, each run from its directory by its package.json script
  # (`npm run <script> -w back`), which names the check it is.
  back-test:
    tests: reuse
  back-lint: {}
  back-typecheck: {}
  back-build: {}
  dashboard-test:
    tests: reuse
  dashboard-lint: {}
  dashboard-typecheck: {}
  dashboard-build: {}

transparency_log:   # the server's log key
  origin: api.hushrun.com/l/jccorzot/sandboxrouting
  key: "ed25519:IuLTaCriRAHf3AzteXA3CmUd2hKcUCygdrD8dZqUKF4="
