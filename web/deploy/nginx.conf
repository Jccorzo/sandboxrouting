# The static export: every page is <path>/index.html (trailingSlash), and 404.html for the rest.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # www.<domain> is mapped here too, so people who type it arrive; send them to the bare domain,
  # which every canonical URL names.
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  # Hashed build assets never change; pages and data are revalidated.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
