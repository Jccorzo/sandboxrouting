# Self-hosted sandboxrouting dashboard: Postgres, back (ingest + read API) and the dashboard, and
# optionally the hosted router (--profile router: MCP and REST on the provider keys people save).
#
#   cp deploy/.env.example deploy/.env      # then set the tokens
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Dashboard: http://localhost:3000 (sign in with SBR_ADMIN_TOKEN, or with GitHub once
# GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET are set). Routers report to
# http://<this host>:8787 with SBR_INGEST_TOKEN, or with an ingest key made in the dashboard.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sbr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: sbr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbr -d sbr"]
      interval: 5s
      timeout: 3s
      retries: 20

  back:
    build:
      context: ..
      dockerfile: back/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sbr:${POSTGRES_PASSWORD}@postgres:5432/sbr
      SBR_ADMIN_TOKEN: ${SBR_ADMIN_TOKEN:?set SBR_ADMIN_TOKEN in deploy/.env}
      SBR_INGEST_TOKEN: ${SBR_INGEST_TOKEN:-}
      SBR_SWEEP_TOKEN: ${SBR_SWEEP_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SBR_SECRETS_KEY: ${SBR_SECRETS_KEY:-}
    ports:
      - "${BACK_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    environment:
      BACK_URL: http://back:8787
      BACK_PUBLIC_URL: ${BACK_PUBLIC_URL:-http://localhost:8787}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      ROUTER_PUBLIC_URL: ${ROUTER_PUBLIC_URL:-}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

  # Optional: the hosted router, on the provider keys people save in the dashboard. Router keys
  # call it at http://<this host>:8788/mcp (MCP) and /v1 (REST). Needs SBR_SECRETS_KEY; set
  # ROUTER_PUBLIC_URL so the dashboard shows the setup snippet. Its sweep (deadlines a provider
  # doesn't enforce) runs from the sweep profile, or any cron.
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile router up -d --build
  router:
    profiles: ["router"]
    build:
      context: ..
      dockerfile: back/Dockerfile
    command: ["node", "back/dist/hosted.js"]
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sbr:${POSTGRES_PASSWORD}@postgres:5432/sbr
      SBR_SECRETS_KEY: ${SBR_SECRETS_KEY:?set SBR_SECRETS_KEY in deploy/.env to run the hosted router}
      SBR_SWEEP_TOKEN: ${SBR_SWEEP_TOKEN:-}
      SBR_HOSTED_MAX_LIVE: ${SBR_HOSTED_MAX_LIVE:-10}
    ports:
      - "${ROUTER_PORT:-8788}:8788"

  # Optional: rolls up closed days and prunes old event ids once an hour (and sweeps the router). Nothing depends on it
  # (reads compute what isn't rolled up); it keeps reads cheap. Any cron can call the same URL.
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile sweep up -d
  sweep:
    profiles: ["sweep"]
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    environment:
      SBR_SWEEP_TOKEN: ${SBR_SWEEP_TOKEN:?set SBR_SWEEP_TOKEN in deploy/.env to run the sweep}
    # Every 5 minutes the router's sweep (when the router profile is up; quiet otherwise), and
    # back's once an hour.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        i=0; while true;
        do curl -fsS -m 300 -X POST -H "authorization: Bearer $$SBR_SWEEP_TOKEN" http://router:8788/internal/sweep 2>/dev/null; echo;
        if [ "$$i" -eq 0 ]; then curl -fsS -X POST -H "authorization: Bearer $$SBR_SWEEP_TOKEN" http://back:8787/v1/sweep; echo; fi;
        i=$$(( (i + 1) % 12 )); sleep 300; done

volumes:
  pgdata:
